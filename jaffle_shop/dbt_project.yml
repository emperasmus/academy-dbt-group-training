# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'jaffle_shop_analytics'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'duckdb_dev'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  jaffle_shop_analytics:
    # Config indicated by + and applies to all files under models/example/
    marts:
      +materialized: table
    staging:
      +materialized: view
# Raw seed data is loaded into dedicated schemas per source system, so models
# can read e.g. `jaffle_app.customers`. The literal schema names (instead of
# dbt's default `<target>_<schema>`) are enforced by the generate_schema_name
# override in macros/.
seeds:
  jaffle_shop_analytics:
    +schema: jaffle_app
    # Seed files are prefixed `raw_` to avoid clashing with model names, but are
    # aliased to the plain table names the models read (jaffle_app.customers).
    raw_customers:
      +alias: customers
    raw_orders:
      +alias: orders
      +column_types:
        _ETL_LOADED_AT: timestamp
    # Payments come from Stripe, a separate source system from the app itself,
    # so they live in their own schema under the opaque name Stripe actually
    # exports them as. Mapping `incoming_payments` back to a friendly `payments`
    # name is exactly what sources.yml's `identifier` field is for — covered in
    # the Sources lesson.
    raw_payments:
      +schema: stripe
      +alias: incoming_payments
